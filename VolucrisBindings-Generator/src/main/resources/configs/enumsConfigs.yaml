package-name: a/name # Only used when all enums are generated in one directory
directory: a/valid/directory # Only used when all enums are generated
generate-all: true # All enums are generated into the same directory
transform-constants-names: true # All enum constants are converted to uppercase, with underscores between words.
configs: # Per enum configs.
  - name: someName
    package-name: a_name # Only used when 'generate-all' is false
    directory: output_directory # Only used when 'generate-all' is false
    transform-constants-names: true
    name-mappings: # Maps a name to a new name. If a constant name appears here `transform-constants-names` has no affect on it
      original_name : someNewName