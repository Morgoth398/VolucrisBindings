name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/nativeSources/**'
      - '.github/workflows/*_Build.yml'
      - '.github/workflows/*_Build.yaml'
      - '**/natives/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/nativeSources/**'
      - '.github/workflows/*_Build.yml'
      - '.github/workflows/*_Build.yaml'
      - '**/natives/**'

jobs:
  Linux_x64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  Linux_Arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  macOS_Arm64:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
          
  macOS_x64:
    runs-on: macos-26-intel
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  Windows_x64:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'oracle'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      shell: bash
